<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Escala de Tarefas</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- SortableJS -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

  <!-- html2canvas -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <link rel="stylesheet" href="calendar.css">
</head>
<body>

<div class="container my-4">
  <div class="calendar-container">

    <!-- Header -->
    <div class="d-flex justify-content-end">
      <button class="btn btn-theme" onclick="toggleTheme()">🌙</button>
    </div>
    <div id="calendarWrapper">
      <div class="d-flex justify-content-center align-items-center mb-3">
        <h2 class="fw-bold" id="monthTitle"></h2>
      </div>

      <!-- Actions -->
      <div class="mt-3 d-flex justify-content-between mb-3 no-export">
        <div class="d-flex gap-2">
          <select id="monthSelect" class="form-select"></select>
          <select id="yearSelect" class="form-select"></select>
        </div>
        <div class="d-flex">
          <button class="btn btn-secondary ms-2" onclick="clearMonth()">Limpar</button>
          <button class="btn ms-2 btn-success" onclick="exportImage()">Exportar</button>
        </div>
      </div>

      <!-- Calendar -->
        <table class="table table-bordered calendar-table text-center">
          <thead>
            <tr>
              <th>Dom</th>
              <th>Seg</th>
              <th>Ter</th>
              <th>Qua</th>
              <th>Qui</th>
              <th>Sex</th>
              <th>Sáb</th>
            </tr>
          </thead>
          <tbody id="calendarBody"></tbody>
        </table>
    </div>
    <hr>
    <h5>Padrão de Cores</h5>
    <div id="customization" style="max-width: 400px;"></div>
  </div>
</div>

<!-- Modal -->
<div class="modal fade" id="taskModal">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5>Adicionar / Editar Tarefa</h5>
      </div>
      <div class="modal-body">
        <select id="taskType" class="form-select mb-2">
          <option value="pregacao" selected>Pregação</option>
          <option value="louvor">Louvor</option>
          <option value="oracao">Oração</option>
          <option value="ofertas">Ofertas</option>
        </select>
        <input type="text" id="personName" class="form-control" placeholder="Nome da pessoa">
        <div id="errorMsg" class="text-danger mt-2 d-none">Digite um nome.</div>
        <label>Cor da tarefa</label>
        <div id="taskColor" class="mb-3"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-danger" id="deleteBtn">Excluir</button>
        <button class="btn btn-primary" onclick="saveTask()">Salvar</button>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap JS (ESSENCIAL) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script src="calendar.js"></script>

</body>
</html>
